name: deploy application

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build project
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t developer13031998maikonmuniz/test-cep:latest .

      - name: Push Docker image
        run: docker push developer13031998maikonmuniz/test-cep:latest

      - name: Decode SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > $HOME/key.pem
          chmod 400 $HOME/key.pem

      - name: Upload key artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-key
          path: $HOME/key.pem

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download SSH key
        uses: actions/download-artifact@v4
        with:
          name: ssh-key

      - name: Move key
        run: |
          mv key.pem /tmp/key.pem
          chmod 400 /tmp/key.pem

      - name: Create app directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key_path: /tmp/key.pem
          script: |
            mkdir -p /home/ubuntu/app

      - name: Copy project to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key_path: /tmp/key.pem
          source: "."
          target: "/home/ubuntu/app"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key_path: /tmp/key.pem
          script: |
            cd /home/ubuntu/app

            echo "DB_URL=${{ secrets.DB_URL }}" > .env
            echo "PASSWORD_ROOT=${{ secrets.PASSWORD_ROOT }}" >> .env
            echo "DB_DATABASE=${{ secrets.DB_DATABASE }}" >> .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASS=${{ secrets.DB_PASS }}" >> .env

            docker compose down || true
            docker compose up -d --build